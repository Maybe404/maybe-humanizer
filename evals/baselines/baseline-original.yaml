# 阶段 1 对照要用的观察
observations:
  - 误改是主要失效模式，12 处里 6 处是逐字项被同义改写（15、19、20、22），
    集中在「语义没丢所以可以换个说法」这一类判断上。原型的逐字项保护应当在这几条上有直接下降证据。
  - 越界 4 处集中在执行强度：minimal_edit 档做了词汇改动（1），polish 档重排了段落（19）。
  - 两处新增内容（18）和一处输入事实捏造（21）是最该被核验步骤拦住的。
  - 空话删完补一句新价值判断（20）与套话换套话（9）是同一个根问题，
    正是 prompts/judge.md 这次收紧的边界要覆盖的。
  - 用例 17 自身 must_remove 与 judge_rubric 矛盾，阶段 1 全量跑之前要修。
  - 机械断言 forbidden_in_report 用子串匹配「分」「AI 写的」会误报（13），断言写法要收紧。
