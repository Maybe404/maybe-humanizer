# 原版基线：前一版 skill，commit 37e96bf，未修契约
# 四类计数定义见 evals/baselines/README.md
run:
  target: 前一版 skill，skills/maybe-humanizer/
  repo: github.com/Maybe404/skill
  commit: 37e96bf
  model: claude-sonnet-5
  temperature: 不可控（claude -p 不能设温度）
  invocation: |-
    printf '%s' "<request>\n\n<body>" | env -u CLAUDECODE claude -p \
      --model claude-sonnet-5 --allowedTools "Read,Grep,Glob,Skill"
    工作目录为一个空项目，.claude/skills/maybe-humanizer 软链到该 commit 的 skill 目录。
  date: 2026-09-07
  raw_outputs: evals/runs/baseline-original/case-<id>.md（未入库，evals/runs/ 在 .gitignore）
  scoring: 机械断言按用例字段人工核对，judge_rubric 人工判定

totals:
  cases: 17
  clean: 5          # 第 5、6、14、16、26 条四类全零
  missed_detection: 2
  missed_handling: 4
  wrong_edit: 11
  out_of_scope: 7

