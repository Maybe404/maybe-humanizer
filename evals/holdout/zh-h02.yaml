request: 帮我改自然点
body: |-
  昨天把那个报表任务从 cron 挪到了调度平台上。挪之前每天早上八点跑，偶尔会和备份撞车，撞上就得手动重跑，一个月大概两三次。挪完之后调度平台会等备份跑完再起，昨晚试了一次，没撞。就一个小坑：平台的时区默认是 UTC，我第一次配成了下午四点，改过来了。
axes: {strength: rewrite, scope: structural}
