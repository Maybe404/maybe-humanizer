id: 101
lang: zh
mode: rewrite
class: fact_preserve
request: 这段周报太啰嗦了，帮我改写一下
body: |-
  本周我们主要围绕支付网关的稳定性开展了一系列卓有成效的工作。值得注意的是，通过对连接池参数的精细化调优，网关 p99 延迟由 620 毫秒下降至 210 毫秒，该数据仅统计了华东机房，华北机房尚未灰度。此外，我们深入分析了上周三的一次超时告警，初步判断可能与上游风控服务的证书轮换有关，但尚未复现。综上所述，本周的工作为下季度的容量规划奠定了坚实的基础，我们将继续保持这一良好势头。
axes: {strength: rewrite, scope: structural}
must_preserve: ["620 毫秒", "210 毫秒", "华东机房", "华北机房尚未灰度", "上周三", "可能", "尚未复现", "证书轮换"]
must_preserve_semantic: ["延迟数据仅统计华东机房", "超时原因是初步判断、可能相关且未复现"]
must_remove: ["卓有成效", "值得注意的是", "此外", "综上所述", "奠定了坚实的基础", "良好势头"]
must_not_add: [{kind: causal_marker}, {kind: number}]
judge_rubric: 「仅统计了华东机房」不得删或后置；「初步判断可能……但尚未复现」三层不确定一层都不得丢；删掉末句后不补新的表态。
