# 中文词表。阶段 1 只供核验步骤计数和复扫用，不是阶段 2 的扫描器。
# 词条照录自前一版 references/patterns-zh.md，顺序不动；说明见 lexicons/README.md。

# 语义项：命题限定词（只计数并标黄，不做硬失败）
qualifiers:
  - 可能
  - 大概
  - 也许
  - 似乎
  - 据说
  - 尚未
  - 暂未
  - 还没
  - 仅
  - 只有
  - 只在
  - 只对
  - 约
  - 大约
  - 大概率
  - 不太确定
  - 我认为
  - 我们认为
  - 目前
  - 预计
  - 疑似
  - 或许
  - 未必

# 语义项：否定词
negations:
  - 不
  - 没
  - 未
  - 无
  - 非
  - 否

# 复核信号：因果标记
causal_markers:
  - 因为
  - 由于
  - 导致
  - 因此
  - 所以
  - 使得
  - 带动
  - 造成
  - 从而

# 复核信号：第一人称
first_person:
  - 我
  - 我们
  - 咱们

