id: ZH-P-002
lang: zh
category: pattern
title: 四字成语堆砌与空心金句
criterion: |
  数连续出现的四字格，再看这一句给出了什么具体事实。四字成语和对仗短语连排、句子却没有落到任何事实上即命中。空心金句是同一现象的另一种形状：听着能摘抄，读完不知道它主张什么（日新月异、瞬息万变、波澜壮阔、势不可挡）。
fix: 删掉整句，或换成一条具体事实；不换成另一批四字格。
pass_when: 成语本身不禁用。单个成语用在字面意思上、句子另有具体内容时不算命中。引用原文、标语和固定表述不动。
known_misses: 只覆盖密度，一句一个成语、通篇十句同样空洞的文本不命中。
examples:
  - good: 过去三年，我们把部署时间从两小时压到了九分钟。代价是每次发布都得盯着监控。
  - bad: 在这个日新月异、瞬息万变的时代，技术的浪潮波澜壮阔、势不可挡。
    why: 四个四字格连排，整句没有一条具体信息，换个主语照样成立。
detector:
  kind: lexicon
  lexicon: ZH-P-002
severity: 2
frequency: null
source:
  decision: adopted
  from: [patterns-zh.md]
