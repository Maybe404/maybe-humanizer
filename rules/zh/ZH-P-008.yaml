id: ZH-P-008
lang: zh
category: pattern
title: 主干不被状语压后
criterion: 数主语和谓语之前有几层前置状语，两层以上即命中。常见形态是「在……背景下」「基于……」「通过……」连着叠。
fix: 把主干提前，状语按需要拆成另一句；不承担信息的状语（综合考量、一系列措施）删掉。
pass_when: 一层前置状语是正常中文。公文里的固定起句（「根据《……办法》第三条」）算一层，本身不构成命中。
known_misses: 后置的长定语链不在本条；跨句的主干延迟数不出来。
examples:
  - good: 公司裁员两百人，原因是订单减少。
  - bad: 在订单持续减少的背景下，基于降本增效的考虑，通过内部评估，公司裁员两百人。
    why: 三层前置状语把「公司裁员两百人」压到句末。
detector:
  kind: regex
  regex: "(在.{1,20}(背景|情况|前提)下|基于.{1,20}(考量|考虑)|通过.{1,20}(措施|手段|方式))"
severity: 3
frequency: null
source:
  decision: adopted
  from: [patterns-zh.md]
