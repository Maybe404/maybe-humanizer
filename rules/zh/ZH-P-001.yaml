id: ZH-P-001
lang: zh
category: pattern
title: 中文高频词与元叙述
criterion: |
  命中两组。第一组是中文 AI 文本的高频书面腔与企业黑话：此外、值得注意的是、在一定程度上、从某种意义上说、至关重要、深入探讨、赋能、抓手、闭环、底层逻辑、颗粒度、打法、格局、生态、凸显、彰显、标志着、令人叹为观止、坐落于、不可或缺、保驾护航、量身打造。第二组是不承担信息的连接词、元叙述和结论标签：综上所述、值得一提的是、我们可以看到、需要指出的是、需要注意的是。
fix: 删掉，或者换成日常说法。
pass_when: |
  删掉的是词，不是词背后原文真实存在的逻辑关系：「此外」删掉之后两句的并列关系仍要读得出来。表里的词正在被定义或被讨论时保留（「闭环控制系统」不进本条）。
known_misses: 没进表的同类说法（持续深耕、全面升级）不命中，词表是模式的代表项。
examples:
  - good: 我们把三个系统的数据接到了一起，退款不用再手动对账了。
  - bad: 此外，构建数据闭环、打通底层逻辑，对于赋能业务增长至关重要。
    why: 此外、闭环、底层逻辑、赋能、至关重要五个词聚在一句里，删掉之后这句话不剩什么。
detector:
  kind: lexicon
  lexicon: ZH-P-001
severity: 2
frequency: null
genre_strength:
  技术长文: 标准
  随意语域: 放宽
source:
  decision: adopted
  from: [patterns-zh.md]
