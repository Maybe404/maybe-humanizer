id: ZH-P-015
lang: zh
category: pattern
title: 中文不吹时代意义
criterion: 夸大意义的说法要删掉或换成具体事实：标志着、见证了、是……的体现／证明、发挥了极其重要的作用、彰显了其重要性、为……奠定基础、关键转折点、不可磨灭的印记。检验方法是删掉这句，看前面那条事实是不是仍然完整；完整就说明这句只在评论。
fix: 删掉评论句；前面的事实句不动。删完不补口号句。
pass_when: 原文作者自己作出的意义判断不算命中，不得删掉原文真有的观点；本条删的是改写方自己加上去的那一句，和纯粹的价值拔高收尾。分不清时进待确认。
known_misses: 替读者总结这段叙述的含义是另一种旁白，归 ZH-P-032。
examples:
  - good: 统计局成立于 1989 年，负责收集和发布全省的统计数据。
  - bad: 县融媒体中心的挂牌，标志着基层传播格局的关键转折点，也彰显了媒体融合的时代意义。
    why: 「标志着」「关键转折点」「彰显」三处评论删掉之后，前面那条事实一个字不少。
detector:
  kind: lexicon
  lexicon: ZH-P-015
severity: 2
frequency: null
source:
